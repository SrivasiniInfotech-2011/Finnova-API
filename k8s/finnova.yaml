            # SystemAdminService reads ConnectionStrings:FinnovaConnection
            - name: ConnectionStrings__FinnovaConnection
              valueFrom:
                secretKeyRef: { name: finnova-db, key: systemadminConnectionString }
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef: { name: finnova-jwt, key: signingKey }
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef: { name: finnova-jwt, key: signingKey }
          readinessProbe:

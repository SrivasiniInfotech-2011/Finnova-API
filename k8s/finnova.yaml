# Finnova backend — four services deployed separately to local Kubernetes.
#
# Only the API gateway is exposed to the host (NodePort 30500). The three backend
# services are ClusterIP (internal only) and are reached by the gateway via their
# Service DNS names, which match the cluster addresses in ApiGateway/appsettings.json:
#   finnova-ua-service:5010, finnova-accounts-service:5020, finnova-systemadmin-service:5030
#
# Each data service has its OWN connection string key in the finnova-db Secret, so the
# services can point at different databases / credentials independently:
#   uaConnectionString          -> finnova-ua-service   (ConnectionStrings:FinnovaConnection)
#   accountsConnectionString    -> finnova-accounts-service   (ConnectionStrings:FinnovaConnection)
#   systemadminConnectionString -> finnova-systemadmin-service (ConnectionStrings:FinnovaConnection)
#
# Databases point at the HOST machine via host.docker.internal. The host SQL Server
# MUST accept SQL authentication (Integrated/Trusted_Connection cannot work from a
# Linux container) and allow TCP connections. Edit the Secret below with real creds.
# They may all point at the same database (as seeded below) or at separate databases.
# ---------------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: finnova-db
type: Opaque
stringData:
  # host.docker.internal resolves to the host machine from Docker Desktop / recent
  # minikube + kind. Change User Id / Password to real SQL logins on your host.
  # Give each service its own string; point them at different Databases if desired
  # (e.g. Database=Finnova_UA / Finnova_Accounts / Finnova_SystemAdmin).
  uaConnectionString:          "Server=host.docker.internal,1433;Database=Finnova_DB;User Id=sa;Password=Srimadvas@123;TrustServerCertificate=True;Encrypt=False"
  accountsConnectionString:    "Server=host.docker.internal,1433;Database=Finnova_DB;User Id=sa;Password=Srimadvas@123;TrustServerCertificate=True;Encrypt=False"
  systemadminConnectionString: "Server=host.docker.internal,1433;Database=Finnova_DB;User Id=sa;Password=Srimadvas@123;TrustServerCertificate=True;Encrypt=False"
---
apiVersion: v1
kind: Secret
metadata:
  name: finnova-jwt
type: Opaque
stringData:
  # Shared signing key — UA signs tokens, the other hosts validate them, so all
  # services must use the SAME key. Replace for anything beyond local play.
  signingKey: "dev-only-signing-key-change-me-min-32-bytes-long-0123456789"
---
# ===================== UA Service (port 5010) =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finnova-ua-service
  labels: { app: finnova-ua-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: finnova-ua-service }
  template:
    metadata:
      labels: { app: finnova-ua-service }
    spec:
      containers:
        - name: ua
          image: finnova-ua-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5010
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: http://+:5010
            # UAService reads ConnectionStrings:FinnovaConnection
            - name: ConnectionStrings__FinnovaConnection
              valueFrom:
                secretKeyRef: { name: finnova-db, key: uaConnectionString }
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef: { name: finnova-jwt, key: signingKey }
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef: { name: finnova-jwt, key: signingKey }
          readinessProbe:
            httpGet: { path: /health, port: 5010 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5010 }
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: finnova-ua-service
spec:
  selector: { app: finnova-ua-service }
  ports:
    - port: 5010
      targetPort: 5010
---
# ===================== Accounts Service (port 5020) =====================

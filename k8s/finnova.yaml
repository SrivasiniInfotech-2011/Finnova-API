apiVersion: v1
kind: Service
metadata:
  name: finnova-systemadmin-service
spec:
  selector: { app: finnova-systemadmin-service }
  ports:
    - port: 5030
      targetPort: 5030
---
# ===================== API Gateway (port 5000, exposed) =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finnova-api-gateway
  labels: { app: finnova-api-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: finnova-api-gateway }
  template:
    metadata:
      labels: { app: finnova-api-gateway }
    spec:
      containers:
        - name: gateway
          image: finnova-api-gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: http://+:5000
            # Allow the UI origin; adjust if your UI runs elsewhere.
            - name: AllowedOrigins
              value: http://localhost:3000
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: finnova-api-gateway
spec:
  type: NodePort
  selector: { app: finnova-api-gateway }
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
---
# ===================== Ingress (hostname-based access) =====================
# Requires an ingress controller in the cluster. For Docker Desktop (Kubeadm) install
# ingress-nginx (pinned release), see k8s/README.md section 7:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/cloud/deploy.yaml
#
# Hostnames resolve via the Windows hosts file (C:\Windows\System32\drivers\etc\hosts):
#   127.0.0.1  gateway.finnova.local ua.finnova.local accounts.finnova.local systemadmin.finnova.local
#
# - gateway.finnova.local    -> gateway (the real entry point; mirrors production topology)
# - <svc>.finnova.local      -> each backend directly, for individual service testing ONLY.
#   These bypass the gateway and are a local-dev convenience; do NOT replicate the direct
#   backend hosts in STG/Prod (see README "Promoting across environments").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finnova-ingress
  annotations:
    # Local HTTP-only testing; no TLS redirect. Remove in TLS-terminating environments.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    # The gateway: single entry point, routes /api/ua, /api/accounts, /api/systemadmin internally.
    - host: gateway.finnova.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finnova-api-gateway
                port:
                  number: 5000
    # Direct-to-backend hosts for individual service testing (bypass the gateway).
    - host: ua.finnova.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finnova-ua-service
                port:
                  number: 5010
    - host: accounts.finnova.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finnova-accounts-service
                port:
                  number: 5020
    - host: systemadmin.finnova.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finnova-systemadmin-service
                port:
                  number: 5030

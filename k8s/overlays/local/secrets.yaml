# Local-only dev Secrets, inline. Safe only because they target host.docker.internal with a
# throwaway SQL login and a dev JWT key. NEVER use inline Secrets in qa/stg/prod — those use a
# secrets-placeholder.yaml wired to a real secret store (External Secrets / CSI driver).
apiVersion: v1
kind: Secret
metadata:
  name: finnova-db
type: Opaque
stringData:
  # host.docker.internal resolves to the host machine from Docker Desktop Kubernetes (Kubeadm).
  # Each data service has its own key so they can point at different databases/credentials.
  uaConnectionString:          "Server=host.docker.internal,1433;Database=Finnova_DB;User Id=sa;Password=Srimadvas@123;TrustServerCertificate=True;Encrypt=False"
  accountsConnectionString:    "Server=host.docker.internal,1433;Database=Finnova_DB;User Id=sa;Password=Srimadvas@123;TrustServerCertificate=True;Encrypt=False"
  systemadminConnectionString: "Server=host.docker.internal,1433;Database=Finnova_DB;User Id=sa;Password=Srimadvas@123;TrustServerCertificate=True;Encrypt=False"
---
apiVersion: v1
kind: Secret
metadata:
  name: finnova-jwt
type: Opaque
stringData:
  # Shared signing key — UA signs tokens, the other services validate them, so all services must
  # use the SAME key. Replace for anything beyond local play.
  signingKey: "dev-only-signing-key-change-me-min-32-bytes-long-0123456789"

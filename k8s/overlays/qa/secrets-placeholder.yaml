# PLACEHOLDER — do NOT commit real credentials. QA/STG/Prod must source these Secrets
# from a real store so nothing sensitive lives in Git. Two common patterns:
#
# 1) External Secrets Operator — define an ExternalSecret that materialises the
#    `finnova-db` and `finnova-jwt` Secrets from AWS Secrets Manager / SSM. Replace this
#    file's contents with your ExternalSecret manifests and remove the stub below.
#
# 2) Secrets Store CSI driver — mount the secret and sync it to a Kubernetes Secret.
#
# The stub values below exist only so `kustomize build` renders; replace before any
# real deploy. The keys MUST stay named exactly as the Deployments consume them:
#   finnova-db: uaConnectionString / accountsConnectionString / systemadminConnectionString
#   finnova-jwt: signingKey
apiVersion: v1
kind: Secret
metadata:
  name: finnova-db
type: Opaque
stringData:
  uaConnectionString:          "REPLACE_FROM_SECRET_STORE"
  accountsConnectionString:    "REPLACE_FROM_SECRET_STORE"
  systemadminConnectionString: "REPLACE_FROM_SECRET_STORE"
---
apiVersion: v1
kind: Secret
metadata:
  name: finnova-jwt
type: Opaque
stringData:
  signingKey: "REPLACE_FROM_SECRET_STORE"

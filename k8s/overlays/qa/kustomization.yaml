# QA overlay — gateway exposed by hostname only, backends internal. Images come from a
# registry at an immutable tag (promote the SAME tag through STG/Prod). Secrets are
# sourced from a real store, NOT committed here (see secrets-placeholder.yaml).
#
# Apply:  kubectl apply -k k8s/overlays/qa
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finnova-qa

resources:
  - ../../base
  # Replace with your real secret source (External Secrets / CSI). See the placeholder.
  - secrets-placeholder.yaml

# Pin to the registry image + immutable tag built in CI. Replace <registry> and <tag>.
images:
  - name: finnova-ua-service
    newName: <registry>/finnova-ua-service
    newTag: <gitsha>
  - name: finnova-accounts-service
    newName: <registry>/finnova-accounts-service
    newTag: <gitsha>
  - name: finnova-systemadmin-service
    newName: <registry>/finnova-systemadmin-service
    newTag: <gitsha>
  - name: finnova-api-gateway
    newName: <registry>/finnova-api-gateway
    newTag: <gitsha>

patches:
  # QA runs Staging (Swagger available for testers). Change to Production to hide it.
  - path: patch-env.yaml
    target: { group: apps, version: v1, kind: Deployment, name: finnova-ua-service }
  - path: patch-env.yaml
    target: { group: apps, version: v1, kind: Deployment, name: finnova-accounts-service }
  - path: patch-env.yaml
    target: { group: apps, version: v1, kind: Deployment, name: finnova-systemadmin-service }
  - path: patch-env.yaml
    target: { group: apps, version: v1, kind: Deployment, name: finnova-api-gateway }
  # Gateway host for QA. Backends stay internal (no direct hosts).
  - path: patch-ingress-host.yaml
  # QA UI origin for gateway CORS.
  - path: patch-gateway-cors.yaml

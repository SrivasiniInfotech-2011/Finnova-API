# STG gateway hostname with TLS. The tls block references a Secret holding the cert;
# with cert-manager, add the issuer annotation and it will populate finnova-stg-tls.
# Gateway only — backends stay ClusterIP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finnova-ingress
  annotations:
    # Example with cert-manager; remove if the cert is provisioned another way.
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - api.stg.finnova.example
      secretName: finnova-stg-tls
  rules:
    - host: api.stg.finnova.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finnova-api-gateway
                port:
                  number: 5000

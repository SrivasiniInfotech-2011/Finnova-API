# PROD gateway hostname with TLS and HTTP->HTTPS redirect. Gateway only — backends
# stay ClusterIP and are never exposed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finnova-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.finnova.example
      secretName: finnova-prod-tls
  rules:
    - host: api.finnova.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finnova-api-gateway
                port:
                  number: 5000
